<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GaitLens モバイル試作</title>
<style>body{font:17px/1.6 system-ui,sans-serif;background:#f2f7f4;color:#173d35;margin:0}main{max-width:850px;margin:auto;padding:20px}header{background:#155a4d;color:white;padding:22px;border-radius:16px}section{background:white;border-radius:14px;margin:16px 0;padding:20px}button,input{font:inherit}button{background:#17664f;color:white;border:0;border-radius:8px;padding:12px 18px;margin:5px}button:disabled{opacity:.4}canvas{width:100%;height:auto;background:#eee}video{display:none}.note{color:#52645e;font-size:14px}#error{color:#a21e1e;white-space:pre-wrap}table{border-collapse:collapse;width:100%}td,th{border-bottom:1px solid #ddd;padding:5px;text-align:left}</style></head><body><main>
<header><h1>GaitLens モバイル試作</h1><p>追加学習YOLOを端末内で解析します</p></header>
<section><h2>1. 動画を選ぶ</h2><input id="videoFile" type="file" accept="video/*"><p class="note">端末内で処理します。短い動画からお試しください。</p><label>解析回数（1秒あたり） <input id="fps" type="number" min="1" max="15" value="5"></label><p><button id="run" disabled>解析を開始</button><button id="stop" disabled>停止</button></p><p id="status" role="status">動画を選んでください。</p><p id="error" role="alert"></p></section>
<section><h2>2. 結果</h2><canvas id="view"></canvas><p id="stats"></p><details><summary>関節ごとの欠損フレーム数</summary><div id="jointStats"></div></details><button id="download" disabled>座標CSVを保存</button><p class="note">試作版。顔のモザイクや骨格動画の書き出しは未対応です。座標は正解値ではありません。</p></section>
<video id="video" muted playsinline preload="auto"></video><canvas id="input" width="640" height="640" hidden></canvas></main><script src="vendor/ort.wasm.min.js"></script><script src="app.js"></script></body></html>
